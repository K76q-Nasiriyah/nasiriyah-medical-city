<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدينة الطب - تبارك حسين</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f0f8ff;padding:10px}.h{background:linear-gradient(90deg,#0077b6,#00b4d8);color:#fff;padding:20px;border-radius:20px;text-align:center}.card{background:#fff;padding:15px;border-radius:15px;margin-top:10px;box-shadow:0 4px 12px rgba(0,0,0,.1)}input{width:100%;padding:11px;margin:5px 0;border:1.5px solid #ddd;border-radius:10px}button{width:100%;padding:12px;background:#0096c7;color:#fff;border:none;border-radius:10px;font-weight:bold} .stat{display:flex;justify-content:space-between;padding:8px;background:#e8f6ff;border-radius:8px;margin:4px 0}.ok{background:#d8f3dc;padding:10px;border-radius:10px;text-align:center;font-weight:bold;color:#1b4332;margin-top:8px}</style></head><body><div class="h"><h2 style="margin:0">🏥 مدينة الطب - ذي قار</h2><p>Solar 100MW - Nasiriyah</p><small>Developer: Tabarak Hussein Blasm</small></div><div class="card"><input id="id" placeholder="ID المريض"><input id="name" placeholder="الاسم"><input id="age" placeholder="العمر"><input id="dis" placeholder="المرض"><input id="doc" placeholder="الطبيب"><input id="pow" type="number" placeholder="الطاقة KW"><button onclick="add()">حفظ + حساب</button></div><div class="card"><div class="stat"><span>المرضى</span><b id="c">0</b></div><div class="stat"><span>المطلوب</span><b id="n">0 KW</b></div><div class="stat"><span>المحطة</span><b>100,000 KW</b></div><div class="stat"><span>المتبقي</span><b id="r">100,000 KW</b></div><div id="s" class="ok">✅ SOLAR IS ENOUGH</div><div id="list"></div></div><script>let t=0,ps=[];function add(){let id=document.getElementById('id').value;let name=document.getElementById('name').value;let age=document.getElementById('age').value;let dis=document.getElementById('dis').value;let doc=document.getElementById('doc').value;let p=parseFloat(document.getElementById('pow').value)||0;if(!name)return alert('اكتبي الاسم');ps.push({id,name,age,dis,doc,p});t+=p;document.getElementById('c').innerText=ps.length;document.getElementById('n').innerText=t+' KW';document.getElementById('r').innerText=(100000-t)+' KW';document.getElementById('s').innerHTML=t<=100000?'✅ SOLAR IS ENOUGH - فائض '+(100000-t)+' KW':'❌ طاقة غير كافية';let h='';ps.forEach((x,i)=>{h+=`<div style="padding:6px;border-right:3px solid #0096c7;margin:5px 0;background:#f8f9fa;border-radius:6px;font-size:13px">${i+1}. ${x.id} | ${x.name} | ${x.age} | ${x.dis} | ${x.doc} | ${x.p} KW</div>`});document.getElementById('list').innerHTML=h;}</script></body></html>
